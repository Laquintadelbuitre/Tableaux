<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2440">
<title>Tableaux</title>
<style>
html,body{margin:0;padding:0}

@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap');
.tb{--ink:#1B2440;--paper:#F6F4F1;--mute:#646A7B;--line:rgba(27,36,64,.12);--red:#D9443B;--green:#2E9E6B;--yellow:#E2B203;
 font-family:Figtree,system-ui,sans-serif;color:var(--ink);min-height:100vh;background:#ECEAE6}
.tb *{box-sizing:border-box}
.tb button{font:inherit;color:inherit;cursor:pointer}
.tb input,.tb textarea,.tb select{font:inherit;color:var(--ink)}
.tb :focus-visible{outline:2px solid #E2B203;outline-offset:2px}
.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.01em}
.btn{border:0;border-radius:9px;padding:9px 14px;background:var(--ink);color:#fff!important;font-weight:600;font-size:14px}
.btn.ghost{background:rgba(27,36,64,.08);color:var(--ink)!important}
.btn.warn{background:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.fld{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;font-size:15px}
.fld:focus{border-color:var(--ink);outline:none}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 0;line-height:1.45}
.err{font-size:13.5px;color:var(--red);margin:8px 0 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inl{display:flex;gap:6px}.inl .fld{flex:1}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:0 0 auto}
.avs{display:flex}.avs .av{margin-left:-6px;box-shadow:0 0 0 2px #fff}.avs .av:first-child{margin-left:0}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink)}
.auth-box{background:var(--paper);border-radius:16px;padding:26px 22px;width:100%;max-width:380px}
.auth h1{font-size:34px;margin:0 0 4px;line-height:1}
.auth p.sub{margin:0 0 18px;color:var(--mute);font-size:14.5px}
.auth .fld{margin-bottom:10px}
.auth .sw{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:14px;margin-top:14px;padding:0}
.blocks{display:flex;gap:4px;margin-bottom:18px}.blocks i{height:10px;border-radius:3px;flex:1}
/* home */
.home-hd{background:var(--ink);color:#fff;padding:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home-hd h1{margin:0;font-size:24px;flex:1}
.hchip{border:0;background:rgba(255,255,255,.12);color:#fff!important;border-radius:999px;padding:7px 12px;font-size:14px}
.home{padding:18px 16px 40px;max-width:980px;margin:0 auto}
.home h2{font-size:15px;font-weight:600;color:var(--mute);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bt{position:relative;border-radius:12px;min-height:92px;padding:12px;color:#fff!important;text-align:left;border:0;display:flex;flex-direction:column;justify-content:space-between}
.bt .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;line-height:1.15;padding-right:26px}
.bt .who{font-size:12px;opacity:.85}
.star{position:absolute;top:8px;right:8px;border:0;background:none;color:#fff!important;font-size:18px;padding:2px 4px;line-height:1}
.newb{border:1.5px dashed rgba(27,36,64,.3);border-radius:12px;padding:12px;min-height:92px}
.sw-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.swatch{width:28px;height:28px;border-radius:7px;border:0}
.swatch.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
/* board */
.bd{min-height:100vh;display:flex;flex-direction:column}
.bd-hd{padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.22);color:#fff}
.bd-hd .back{border:0;background:rgba(255,255,255,.18);color:#fff!important;border-radius:8px;padding:6px 10px;font-size:14px}
.bd-name{flex:1;min-width:120px;border:0;background:transparent;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;padding:4px 6px;border-radius:7px}
.bd-name:focus{background:rgba(255,255,255,.95);color:var(--ink)}
.bd-hd .star{position:static}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:rgba(0,0,0,.12);scrollbar-width:none;align-items:center}
.tool{border:0;background:rgba(255,255,255,.2);color:#fff!important;border-radius:8px;padding:6px 11px;font-size:13.5px;white-space:nowrap}
.tool.on{background:#fff;color:var(--ink)!important}
.tools select,.tools input{border:0;border-radius:8px;padding:6px 8px;font-size:13.5px;background:rgba(255,255,255,.92)}
.tools input{min-width:130px}
.sync{font-size:12px;color:#fff;opacity:.8;margin-left:auto;white-space:nowrap}
.lanes{flex:1;display:flex;gap:10px;overflow-x:auto;padding:12px 14px 24px;align-items:flex-start;scroll-snap-type:x mandatory}
.lane{flex:0 0 min(84vw,280px);background:var(--paper);border-radius:12px;padding:8px;max-height:calc(100vh - 150px);display:flex;flex-direction:column;scroll-snap-align:start;position:relative}
.lane.drop{box-shadow:inset 0 0 0 2px var(--yellow)}
.lh{display:flex;align-items:center;gap:4px;padding:2px 2px 6px}
.lh input{flex:1;min-width:0;border:0;background:transparent;font-weight:600;font-size:15px;padding:5px 6px;border-radius:6px}
.lh input:focus{background:#fff;outline:1.5px solid var(--ink)}
.n{font-size:12.5px;color:var(--mute)}
.dots{border:0;background:none;padding:4px 8px;border-radius:6px;font-size:18px;line-height:1}
.dots:hover{background:rgba(27,36,64,.08)}
.menu{position:absolute;top:40px;right:8px;z-index:5;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(27,36,64,.22);padding:6px;width:220px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:14px}
.menu button:hover{background:rgba(27,36,64,.07)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.cards{overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding:2px;min-height:8px}
.cd{background:#fff;border-radius:9px;text-align:left;border:0;box-shadow:0 1px 0 rgba(27,36,64,.15);width:100%;padding:0;overflow:hidden}
.cd:hover{box-shadow:0 0 0 1.5px var(--ink)}
.cd .cv{height:30px}
.cd .in{padding:8px 10px}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.pill{border-radius:4px;color:#fff;font-size:11.5px;font-weight:600;padding:1px 7px;min-width:36px;min-height:16px}
.ct{font-size:14.5px;line-height:1.3;word-break:break-word}
.badges{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--mute)}
.badges .avs{margin-left:auto}.badges .av{width:24px;height:24px;font-size:10px}
.due{border-radius:4px;padding:1px 5px}
.due.late{background:var(--red);color:#fff}.due.soon{background:var(--yellow);color:var(--ink)}.due.done{background:var(--green);color:#fff}
.add input{width:100%;border:0;background:transparent;border-radius:8px;padding:9px 8px;font-size:14px;margin-top:4px}
.add input:hover{background:rgba(27,36,64,.06)}
.add input:focus{background:#fff;outline:1.5px solid var(--ink)}
.newlane{flex:0 0 240px;background:rgba(255,255,255,.25);border-radius:12px;padding:6px}
.newlane input{width:100%;border:0;background:transparent;color:#fff;padding:8px;font-size:14px;border-radius:8px}
.newlane input::placeholder{color:#fff;opacity:.9}
.newlane input:focus{background:#fff;color:var(--ink)}
.empty{font-size:13px;color:var(--mute);padding:6px 4px}
.agenda{padding:14px;max-width:720px;width:100%;margin:0 auto}
.agenda h3{color:#fff;font-size:15px;margin:18px 0 8px}
.agenda .cd{margin-bottom:7px}
.agenda .lst{font-size:12px;color:var(--mute)}
/* modale */
.ov{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:620px;max-height:93vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 0 32px}
@media(min-width:680px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet .cv{height:56px}
.sh-in{padding:16px 18px 0}
.sh-top{display:flex;gap:10px;align-items:flex-start}
.ttl{flex:1;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;border:0;background:transparent;padding:4px;border-radius:7px;resize:none;line-height:1.2;margin:0}
textarea.ttl:focus{background:#fff;outline:1.5px solid var(--ink)}
.x{border:0;background:rgba(27,36,64,.08);border-radius:50%;width:34px;height:34px;font-size:18px;flex:0 0 auto}
.sec{margin-top:18px}
.sec h4{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px}
.tg{border:1.5px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;background:#fff}
.tg.on{color:#fff!important;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-bottom:6px}
.prog div{flex:1;height:6px;background:rgba(27,36,64,.1);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.ci{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.ci input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);flex:0 0 auto}
.ci span{flex:1;word-break:break-word}
.ci.d span{text-decoration:line-through;color:var(--mute)}
.del{border:0;background:transparent;color:var(--mute);font-size:16px;padding:2px 6px}
.cl{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.cl-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.cl-h span{flex:1}
.cm{background:#fff;border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:14px}
.cm-h{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.cm-h b{font-weight:600}.cm-h time{color:var(--mute);font-size:12px;flex:1}
.cm-h button{border:0;background:none;color:var(--mute);font-size:12.5px;text-decoration:underline;padding:0}
.att{display:flex;align-items:center;gap:8px;background:#fff;border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.att a{flex:1;color:#2F6FD1;word-break:break-all}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.mrow span{flex:1;min-width:0;word-break:break-word}
.mrow small{display:block;color:var(--mute);font-size:12px}
.act{font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.act time{display:block;font-size:11.5px;color:var(--mute)}
.lbrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lbrow .sw-row{margin:0}
.lbrow .swatch{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(20px);opacity:0}}}

</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
<div id="root" class="tb"><div style="padding:24px;font-family:system-ui">Chargement…</div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* ============ Configuration ============ */
// 1. URL /exec de votre déploiement Apps Script
const API_URL = "";
// 2. ID client OAuth Google (le même que dans Code.gs)
const GOOGLE_CLIENT_ID = "";

/* ============ Connexion Google ============ */
// Le jeton Google reste en mémoire : rien n'est enregistré dans le navigateur.
let ID_TOKEN = null, TOKEN_EXP = 0, waiters = [], gisReady = null;
function onCredential(resp) {
  ID_TOKEN = resp.credential;
  try {
    let part = ID_TOKEN.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while (part.length % 4) part += "=";
    TOKEN_EXP = JSON.parse(atob(part)).exp * 1000;
  } catch (e) { TOKEN_EXP = 0; }
  const w = waiters; waiters = []; w.forEach((f) => f(true));
  window.dispatchEvent(new Event("tb-credential"));
}
function initGoogle() {
  if (!gisReady) gisReady = new Promise((resolve) => {
    const start = () => {
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
      resolve();
    };
    if (window.google?.accounts?.id) start();
    else { const t = setInterval(() => { if (window.google?.accounts?.id) { clearInterval(t); start(); } }, 100); }
  });
  return gisReady;
}
// Demande discrètement un nouveau jeton (il expire au bout d'une heure)
function refreshToken() {
  return new Promise(async (resolve) => {
    await initGoogle();
    let to;
    const done = (ok) => { clearTimeout(to); resolve(ok); };
    to = setTimeout(() => { waiters = waiters.filter((f) => f !== done); resolve(false); }, 20000);
    waiters.push(done);
    google.accounts.id.prompt();
  });
}

async function api(action, data = {}, retried = false) {
  if (ID_TOKEN && TOKEN_EXP && TOKEN_EXP - Date.now() < 90000) await refreshToken();
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, token: ID_TOKEN, ...data }) });
  if (!res.ok) throw new Error("Le serveur ne répond pas (" + res.status + ").");
  const j = await res.json();
  if (j.error === "SESSION" && !retried && ID_TOKEN && (await refreshToken())) return api(action, data, true);
  if (j.error) {
    if (j.error === "SESSION") window.dispatchEvent(new Event("tb-session"));
    throw new Error(j.error);
  }
  return j;
}
const errText = (e) => ({
  SESSION: "Votre connexion Google a expiré. Reconnectez-vous.",
  ACCES: "Vous n'êtes pas membre de ce tableau.",
  INTROUVABLE: "Ce tableau n'existe plus.",
}[e.message] || (e.message === "Failed to fetch" ? "Connexion impossible. Vérifiez votre réseau et l'URL du script." : e.message));

/* ============ Utilitaires ============ */
const rnd = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
let ID_SEQ = null;
const uid = () => (ID_SEQ ? ID_SEQ() : rnd());
const clone = (o) => JSON.parse(JSON.stringify(o));
const norm = (e) => e.trim().toLowerCase();
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

// Une modification = une fonction rejouable : mêmes identifiants à chaque rejeu.
function makeOp(fn, log, who) {
  const seed = rnd(), at = Date.now();
  return (bb) => {
    let n = 0;
    ID_SEQ = () => seed + "-" + (n++).toString(36);
    try {
      const r = fn(bb) || bb;
      if (log) r.activity = [{ id: seed + "-log", at, who, text: log }, ...(r.activity || [])].slice(0, 200);
      return r;
    } finally { ID_SEQ = null; }
  };
}
const replay = (base, ops) => ops.reduce((bb, op) => { try { return op(bb); } catch (e) { return bb; } }, clone(base));

const PALETTE = ["#2E9E6B", "#E2B203", "#E07B24", "#D9443B", "#8A5CC7", "#2F6FD1", "#2BA3C4", "#7AA83A", "#D3539B", "#4A4F5C"];
const BG = ["#2F6FD1", "#2E9E6B", "#8A5CC7", "#D9443B", "#E07B24", "#2BA3C4", "#D3539B", "#4A4F5C"];
const colorOf = (s) => PALETTE[[...(s || "")].reduce((a, ch) => a + ch.charCodeAt(0), 0) % PALETTE.length];
const initials = (n) => (n || "?").split(/[\s@._-]+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

const newCard = (title) => ({
  id: uid(), title, desc: "", labels: [], members: [], start: "", due: "", dueDone: false,
  checklists: [], comments: [], attachments: [], cover: "", archived: false, createdAt: Date.now(),
});
function dueState(c) {
  if (!c.due) return null;
  if (c.dueDone) return "done";
  const d = new Date(c.due) - Date.now();
  if (d < 0) return "late";
  if (d < 86400000) return "soon";
  return "later";
}
const fmtDue = (s) => new Date(s).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtDay = (s) => new Date(s + "T00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const fmtAgo = (t) => new Date(t).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

/* ============ Petits composants ============ */
function Avatar({ name, email, size }) {
  return <span className="av" title={name || email} style={{ background: colorOf(email || name), ...(size ? { width: size, height: size } : {}) }}>{initials(name || email)}</span>;
}
function Confirm({ label, confirmLabel, onConfirm, className = "btn ghost" }) {
  const [armed, setArmed] = useState(false);
  return armed ? (
    <span className="row">
      <button className="btn warn" onClick={() => { setArmed(false); onConfirm(); }}>{confirmLabel}</button>
      <button className="btn ghost" onClick={() => setArmed(false)}>Annuler</button>
    </span>
  ) : <button className={className} onClick={() => setArmed(true)}>{label}</button>;
}
function AddInput({ placeholder, onAdd, className = "fld", blurAdds = true }) {
  const [v, setV] = useState("");
  const go = () => { if (v.trim()) { onAdd(v.trim()); setV(""); } };
  return <input className={className} value={v} placeholder={placeholder} onChange={(e) => setV(e.target.value)}
    onKeyDown={(e) => { if (e.key === "Enter") go(); if (e.key === "Escape") setV(""); }} onBlur={() => blurAdds && go()} />;
}
function Sheet({ title, onClose, cover, children }) {
  useEffect(() => { const k = (e) => e.key === "Escape" && onClose(); window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, [onClose]);
  return (
    <div className="ov" onClick={onClose}>
      <div className="sheet" role="dialog" aria-label={typeof title === "string" ? title : "Détails"} onClick={(e) => e.stopPropagation()}>
        {cover && <div className="cv" style={{ background: cover }} />}
        <div className="sh-in">
          {typeof title === "string" ? (
            <div className="sh-top"><h2 className="ttl">{title}</h2><button className="x" onClick={onClose} aria-label="Fermer">×</button></div>
          ) : title}
          {children}
        </div>
      </div>
    </div>
  );
}
function Swatches({ colors, value, onPick, allowNone }) {
  return (
    <div className="sw-row">
      {allowNone && <button className={"swatch" + (!value ? " on" : "")} style={{ background: "#fff", border: "1.5px solid rgba(27,36,64,.2)" }} onClick={() => onPick("")} aria-label="Aucune" />}
      {colors.map((c) => <button key={c} className={"swatch" + (value === c ? " on" : "")} style={{ background: c }} onClick={() => onPick(c)} aria-label={"Couleur " + c} />)}
    </div>
  );
}

/* ============ Connexion ============ */
function Auth({ busy, message }) {
  const btn = useRef(null);
  useEffect(() => {
    let alive = true;
    initGoogle().then(() => {
      if (!alive || !btn.current) return;
      google.accounts.id.renderButton(btn.current, { theme: "filled_blue", size: "large", shape: "pill", text: "continue_with", locale: "fr", width: 280 });
      google.accounts.id.prompt();
    });
    return () => { alive = false; };
  }, []);
  return (
    <div className="auth">
      <div className="auth-box">
        <div className="blocks"><i style={{ background: "#2F6FD1" }} /><i style={{ background: "#2E9E6B", flex: 0.6 }} /><i style={{ background: "#E2B203", flex: 1.4 }} /></div>
        <h1 className="disp">Tableaux</h1>
        <p className="sub">{busy ? "Connexion en cours…" : "Connectez-vous avec votre compte Google pour retrouver vos projets."}</p>
        <div ref={btn} style={{ minHeight: 44, display: busy ? "none" : "block" }} />
        {message && <p className="err" role="alert">{message}</p>}
        <p className="hint" style={{ marginTop: 16 }}>Aucun mot de passe n'est créé ni conservé. Seuls votre adresse e-mail et votre prénom servent à vous identifier dans les tableaux.</p>
      </div>
    </div>
  );
}

/* ============ Accueil ============ */
function Home({ user, toggleStar, setName, open, logout }) {
  const [boards, setBoards] = useState(null);
  const [err, setErr] = useState("");
  const [creating, setCreating] = useState(false);
  const [busy, setBusy] = useState(false);
  const [nb, setNb] = useState({ name: "", color: BG[0] });
  const [q, setQ] = useState("");
  const [panel, setPanel] = useState(null);

  const load = useCallback(async () => {
    try { const r = await api("listBoards"); setBoards(r.boards); setErr(""); } catch (e) { setErr(errText(e)); }
  }, []);
  useEffect(() => { load(); const t = setInterval(load, 30000); return () => clearInterval(t); }, [load]);

  const create = async () => {
    if (!nb.name.trim() || busy) return;
    setBusy(true);
    try { const r = await api("createBoard", { name: nb.name.trim(), color: nb.color }); setCreating(false); setNb({ name: "", color: BG[0] }); open(r.id); }
    catch (e) { setErr(errText(e)); }
    setBusy(false);
  };

  const shown = (boards || []).filter((b) => !q || b.name.toLowerCase().includes(q.toLowerCase()));
  const starred = shown.filter((b) => user.stars.includes(b.id));
  const tile = (b) => (
    <div key={b.id} style={{ position: "relative" }}>
      <button className="bt" style={{ background: b.color, width: "100%" }} onClick={() => open(b.id)}>
        <span className="nm">{b.name}</span>
        <span className="who">{b.owner === user.email ? "Créé par vous" : `Partagé par ${b.ownerName}`}</span>
      </button>
      <button className="star" aria-label={user.stars.includes(b.id) ? "Retirer des favoris" : "Ajouter aux favoris"} onClick={() => toggleStar(b.id)}>{user.stars.includes(b.id) ? "★" : "☆"}</button>
    </div>
  );

  return (
    <div>
      <header className="home-hd">
        <h1 className="disp">Tableaux</h1>
        <button className="hchip" onClick={() => setPanel("account")}><span className="row"><Avatar name={user.name} email={user.email} size={20} />{user.name}</span></button>
      </header>
      <main className="home">
        <input className="fld" placeholder="Rechercher un tableau" value={q} onChange={(e) => setQ(e.target.value)} />
        {err && <p className="err" role="alert">{err}</p>}
        {boards === null ? <p className="empty">Chargement des tableaux…</p> : (
          <>
            {starred.length > 0 && <><h2>Favoris</h2><div className="grid">{starred.map(tile)}</div></>}
            <h2>Vos tableaux</h2>
            <div className="grid">
              {shown.map(tile)}
              {creating ? (
                <div className="newb">
                  <input className="fld" autoFocus placeholder="Nom du tableau" value={nb.name} onChange={(e) => setNb({ ...nb, name: e.target.value })} onKeyDown={(e) => e.key === "Enter" && create()} />
                  <Swatches colors={BG} value={nb.color} onPick={(color) => setNb({ ...nb, color })} />
                  <div className="row"><button className="btn" onClick={create} disabled={!nb.name.trim() || busy}>{busy ? "Création…" : "Créer"}</button><button className="btn ghost" onClick={() => setCreating(false)}>Annuler</button></div>
                </div>
              ) : <button className="newb" onClick={() => setCreating(true)}>+ Créer un tableau</button>}
            </div>
            {boards.length === 0 && <p className="hint">Chaque tableau est un projet indépendant. Créez le premier, puis invitez d'autres personnes par e-mail depuis le tableau.</p>}
          </>
        )}
      </main>

      {panel === "account" && (
        <Sheet title="Compte" onClose={() => setPanel(null)}>
          <div className="sec">
            <div className="mrow"><Avatar name={user.name} email={user.email} /><span>{user.name}<small>{user.email}</small></span></div>
            <div className="sec">
              <h4>Prénom affiché</h4>
              <input className="fld" defaultValue={user.name} onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== user.name) setName(v); }} />
            </div>
            <div className="sec"><button className="btn" onClick={logout}>Se déconnecter</button></div>
          </div>
        </Sheet>
      )}
    </div>
  );
}

/* ============ Tableau ============ */
function Board({ id, user, toggleStar, back }) {
  const [b, setB] = useState(null);
  const [state, setState] = useState("loading");
  const [sync, setSync] = useState("ok");
  const [openId, setOpenId] = useState(null);
  const [panel, setPanel] = useState(null);
  const [view, setView] = useState("board");
  const [menu, setMenu] = useState(null);
  const [f, setF] = useState({ q: "", member: "", label: "", due: "" });
  const [drop, setDrop] = useState(null);
  const ref = useRef(null);       // état affiché
  const server = useRef(null);    // dernière version confirmée par le serveur
  const queue = useRef([]);       // modifications pas encore envoyées
  const inflight = useRef(false);
  const timer = useRef(null);
  const flushRef = useRef(null);
  const dragCard = useRef(null);
  const dragList = useRef(null);

  const show = (x) => { ref.current = x; setB(x); };
  const fail = (e) => {
    if (e.message === "ACCES") setState("denied");
    else if (e.message === "INTROUVABLE") setState("missing");
  };

  const flush = async () => {
    clearTimeout(timer.current);
    if (inflight.current || !queue.current.length || !server.current) return;
    inflight.current = true; setSync("saving");
    const ops = queue.current.splice(0);
    let base = server.current;
    try {
      for (let attempt = 0; ; attempt++) {
        const toSend = replay(base, ops);
        const r = await api("saveBoard", { id, board: toSend, baseVersion: base.version });
        if (r.ok) { server.current = { ...toSend, version: r.version }; break; }
        if (r.conflict && attempt < 3) { base = r.board; continue; }
        throw new Error("Trop de modifications simultanées, nouvel essai.");
      }
      show(replay(server.current, queue.current));
      setSync("ok");
    } catch (e) {
      fail(e);
      queue.current = [...ops, ...queue.current];
      setSync("error");
      timer.current = setTimeout(() => flushRef.current(), 8000);
    } finally { inflight.current = false; }
    if (queue.current.length) timer.current = setTimeout(() => flushRef.current(), 400);
  };
  flushRef.current = flush;

  const commit = useCallback((fn, log) => {
    const op = makeOp(fn, log, user.name);
    show(op(clone(ref.current)));
    queue.current.push(op);
    setSync("pending");
    clearTimeout(timer.current);
    timer.current = setTimeout(() => flushRef.current(), 700);
  }, [user.name]);

  const reload = async () => {
    const r = await api("getBoard", { id });
    server.current = r.board; show(replay(r.board, queue.current));
  };

  useEffect(() => {
    let alive = true;
    (async () => {
      try { const r = await api("getBoard", { id }); if (!alive) return; server.current = r.board; show(r.board); setState("ok"); }
      catch (e) { if (!alive) return; fail(e); if (e.message !== "ACCES" && e.message !== "INTROUVABLE") setState("error:" + errText(e)); }
    })();
    const t = setInterval(async () => {
      if (inflight.current || queue.current.length || !server.current) return;
      try {
        const r = await api("getBoard", { id, version: server.current.version });
        if (r.board && !inflight.current && !queue.current.length) { server.current = r.board; show(r.board); }
      } catch (e) { fail(e); }
    }, 15000);
    const vis = () => document.visibilityState === "hidden" && flushRef.current();
    const unload = (e) => { if (queue.current.length || inflight.current) { e.preventDefault(); e.returnValue = ""; } };
    document.addEventListener("visibilitychange", vis);
    window.addEventListener("beforeunload", unload);
    return () => { alive = false; clearInterval(t); clearTimeout(timer.current); document.removeEventListener("visibilitychange", vis); window.removeEventListener("beforeunload", unload); };
  }, [id]);

  const leave = async () => { await flushRef.current(); back(); };

  if (state === "loading") return <div className="auth"><div className="auth-box"><p className="sub" style={{ margin: 0 }}>Chargement du tableau…</p></div></div>;
  if (state !== "ok") return (
    <div className="auth"><div className="auth-box">
      <h1 className="disp" style={{ fontSize: 26 }}>{state === "missing" ? "Ce tableau n'existe plus" : state === "denied" ? "Accès refusé" : "Chargement impossible"}</h1>
      <p className="sub">{state === "missing" ? "Il a été supprimé par son créateur." : state === "denied" ? "Vous n'êtes pas membre de ce tableau. Demandez à son créateur de vous inviter avec votre adresse e-mail." : state.slice(6)}</p>
      <button className="btn" onClick={back}>Retour aux tableaux</button>
    </div></div>
  );

  const isOwner = b.owner === user.email;
  const activeLists = b.lists.filter((l) => !l.archived);
  const visible = (c) => {
    if (c.archived) return false;
    if (f.q && !(c.title + " " + c.desc).toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.member && !c.members.includes(f.member)) return false;
    if (f.label && !c.labels.includes(f.label)) return false;
    if (f.due === "none" && c.due) return false;
    if (f.due === "late" && dueState(c) !== "late") return false;
    if (f.due === "week" && !(c.due && !c.dueDone && new Date(c.due) - Date.now() < 7 * 86400000 && new Date(c.due) >= Date.now())) return false;
    if (f.due === "done" && dueState(c) !== "done") return false;
    return true;
  };
  const filtering = f.q || f.member || f.label || f.due;

  const moveCard = (cardId, listId, beforeId) => {
    const card = b.cards[cardId]; const to = b.lists.find((l) => l.id === listId);
    const from = b.lists.find((l) => l.cardIds.includes(cardId));
    commit((bb) => {
      const t = bb.lists.find((l) => l.id === listId); if (!t || !bb.cards[cardId]) return bb;
      bb.lists.forEach((l) => (l.cardIds = l.cardIds.filter((x) => x !== cardId)));
      const i = beforeId ? t.cardIds.indexOf(beforeId) : -1;
      if (i >= 0) t.cardIds.splice(i, 0, cardId); else t.cardIds.push(cardId);
      return bb;
    }, from && to && from.id !== to.id ? `a déplacé « ${card?.title} » vers « ${to.name} »` : null);
  };
  const moveList = (listId, beforeId) => commit((bb) => {
    const l = bb.lists.find((x) => x.id === listId); if (!l) return bb;
    bb.lists = bb.lists.filter((x) => x.id !== listId);
    const i = bb.lists.findIndex((x) => x.id === beforeId);
    if (i >= 0) bb.lists.splice(i, 0, l); else bb.lists.push(l);
    return bb;
  });
  const shiftList = (listId, dir) => {
    const act = activeLists.map((l) => l.id); const i = act.indexOf(listId); const j = i + dir;
    if (j < 0 || j >= act.length) return;
    if (dir < 0) moveList(listId, act[j]); else moveList(listId, act[j + 1] || null);
  };
  const sortList = (listId, by) => commit((bb) => {
    const l = bb.lists.find((x) => x.id === listId); if (!l) return bb;
    const key = { name: (c) => (c.title || "").toLowerCase(), due: (c) => c.due || "9999", created: (c) => c.createdAt || 0 };
    l.cardIds.sort((a, z) => { const A = key[by](bb.cards[a] || {}), Z = key[by](bb.cards[z] || {}); return A < Z ? -1 : A > Z ? 1 : 0; });
    return bb;
  });

  const openCard = openId && b.cards[openId];
  const archivedCards = Object.values(b.cards).filter((c) => c.archived);
  const archivedLists = b.lists.filter((l) => l.archived);
  const syncText = { saving: "Enregistrement…", pending: "Modifications en attente", error: "Hors ligne, nouvel essai bientôt", ok: "Enregistré dans Sheets" }[sync];

  return (
    <div className="bd" style={{ background: b.color }}>
      <header className="bd-hd">
        <button className="back" onClick={leave} aria-label="Retour à la liste des tableaux">‹ Tableaux</button>
        <input className="bd-name" key={b.name} defaultValue={b.name} aria-label="Nom du tableau"
          onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== b.name) commit((bb) => { bb.name = v; return bb; }, `a renommé le tableau en « ${v} »`); }} />
        <button className="star" onClick={() => toggleStar(id)} aria-label="Favori">{user.stars.includes(id) ? "★" : "☆"}</button>
        <button className="back" onClick={() => setPanel("members")}><span className="avs">{b.members.slice(0, 4).map((m) => <Avatar key={m.email} name={m.name} email={m.email} size={22} />)}</span></button>
      </header>
      <div className="tools">
        <button className={"tool" + (view === "board" ? " on" : "")} onClick={() => setView("board")}>Tableau</button>
        <button className={"tool" + (view === "dates" ? " on" : "")} onClick={() => setView("dates")}>Échéances</button>
        <input placeholder="Rechercher" value={f.q} onChange={(e) => setF({ ...f, q: e.target.value })} aria-label="Rechercher une carte" />
        <select value={f.member} onChange={(e) => setF({ ...f, member: e.target.value })} aria-label="Filtrer par membre">
          <option value="">Tous les membres</option>
          {b.members.map((m) => <option key={m.email} value={m.email}>{m.email === user.email ? "Mes cartes" : m.name}</option>)}
        </select>
        <select value={f.label} onChange={(e) => setF({ ...f, label: e.target.value })} aria-label="Filtrer par étiquette">
          <option value="">Toutes les étiquettes</option>
          {b.labels.map((l, i) => <option key={l.id} value={l.id}>{l.name || `Étiquette ${i + 1}`}</option>)}
        </select>
        <select value={f.due} onChange={(e) => setF({ ...f, due: e.target.value })} aria-label="Filtrer par échéance">
          <option value="">Toutes les échéances</option><option value="late">En retard</option><option value="week">Cette semaine</option>
          <option value="done">Terminées</option><option value="none">Sans échéance</option>
        </select>
        {filtering && <button className="tool" onClick={() => setF({ q: "", member: "", label: "", due: "" })}>Effacer les filtres</button>}
        <button className="tool" onClick={() => setPanel("labels")}>Étiquettes</button>
        <button className="tool" onClick={() => setPanel("archive")}>Archives</button>
        <button className="tool" onClick={() => setPanel("activity")}>Activité</button>
        <button className="tool" onClick={() => setPanel("settings")}>Paramètres</button>
        <span className="sync">{syncText}</span>
      </div>

      {view === "board" ? (
        <main className="lanes" onClick={() => menu && setMenu(null)}>
          {activeLists.map((l, idx) => {
            const cards = l.cardIds.map((x) => b.cards[x]).filter((c) => c && !c.archived);
            const shown = cards.filter(visible);
            return (
              <section key={l.id} className={"lane" + (drop === l.id ? " drop" : "")}
                onDragOver={(e) => { e.preventDefault(); setDrop(l.id); }} onDragLeave={() => setDrop(null)}
                onDrop={(e) => {
                  e.preventDefault(); setDrop(null);
                  if (dragList.current && dragList.current !== l.id) moveList(dragList.current, l.id);
                  else if (dragCard.current) moveCard(dragCard.current, l.id);
                  dragCard.current = null; dragList.current = null;
                }}>
                <div className="lh" draggable onDragStart={() => (dragList.current = l.id)} onDragEnd={() => (dragList.current = null)}>
                  <input key={l.name} defaultValue={l.name} aria-label="Nom de la liste"
                    onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== l.name) commit((bb) => { const x = bb.lists.find((y) => y.id === l.id); if (x) x.name = v; return bb; }); }} />
                  <span className="n">{filtering ? `${shown.length}/${cards.length}` : cards.length}</span>
                  <button className="dots" aria-label="Actions de la liste" onClick={(e) => { e.stopPropagation(); setMenu(menu === l.id ? null : l.id); }}>⋯</button>
                </div>
                {menu === l.id && (
                  <div className="menu" onClick={(e) => e.stopPropagation()}>
                    {idx > 0 && <button onClick={() => { shiftList(l.id, -1); setMenu(null); }}>Déplacer vers la gauche</button>}
                    {idx < activeLists.length - 1 && <button onClick={() => { shiftList(l.id, 1); setMenu(null); }}>Déplacer vers la droite</button>}
                    <hr />
                    <button onClick={() => { sortList(l.id, "name"); setMenu(null); }}>Trier par nom</button>
                    <button onClick={() => { sortList(l.id, "due"); setMenu(null); }}>Trier par échéance</button>
                    <button onClick={() => { sortList(l.id, "created"); setMenu(null); }}>Trier par date de création</button>
                    <hr />
                    <button onClick={() => { commit((bb) => { bb.lists.find((x) => x.id === l.id)?.cardIds.forEach((x) => bb.cards[x] && (bb.cards[x].archived = true)); return bb; }, `a archivé toutes les cartes de « ${l.name} »`); setMenu(null); }}>Archiver toutes les cartes</button>
                    <button onClick={() => { commit((bb) => { const x = bb.lists.find((y) => y.id === l.id); if (x) x.archived = true; return bb; }, `a archivé la liste « ${l.name} »`); setMenu(null); }}>Archiver la liste</button>
                  </div>
                )}
                <div className="cards">
                  {shown.map((c) => (
                    <CardTile key={c.id} c={c} b={b} onOpen={() => setOpenId(c.id)} dragProps={{
                      draggable: true,
                      onDragStart: (e) => { e.stopPropagation(); dragCard.current = c.id; dragList.current = null; },
                      onDragOver: (e) => e.preventDefault(),
                      onDrop: (e) => { e.preventDefault(); e.stopPropagation(); setDrop(null); if (dragCard.current && dragCard.current !== c.id) moveCard(dragCard.current, l.id, c.id); dragCard.current = null; },
                    }} />
                  ))}
                  {shown.length === 0 && filtering && cards.length > 0 && <div className="empty">Aucune carte ne correspond aux filtres.</div>}
                </div>
                <div className="add">
                  <AddInput className="" placeholder="+ Ajouter une carte" onAdd={(title) => commit((bb) => {
                    const c = newCard(title);
                    if (f.member) c.members = [f.member];
                    if (f.label) c.labels = [f.label];
                    bb.cards[c.id] = c; bb.lists.find((x) => x.id === l.id)?.cardIds.push(c.id); return bb;
                  }, `a ajouté « ${title} » à « ${l.name} »`)} />
                </div>
              </section>
            );
          })}
          <div className="newlane">
            <AddInput className="" placeholder="+ Ajouter une liste" onAdd={(name) => commit((bb) => { bb.lists.push({ id: uid(), name, archived: false, cardIds: [] }); return bb; }, `a ajouté la liste « ${name} »`)} />
          </div>
        </main>
      ) : (
        <Agenda b={b} visible={visible} open={setOpenId} />
      )}

      {openCard && <CardModal key={openCard.id} c={openCard} b={b} user={user} commit={commit} close={() => setOpenId(null)} />}

      {panel === "members" && <MembersPanel b={b} user={user} isOwner={isOwner} reload={reload} leave={back} close={() => setPanel(null)} />}

      {panel === "labels" && (
        <Sheet title="Étiquettes" onClose={() => setPanel(null)}>
          <div className="sec">
            {b.labels.map((l) => (
              <div key={l.id} className="lbrow">
                <input className="fld" style={{ borderLeft: `10px solid ${l.color}` }} key={l.name} defaultValue={l.name} placeholder="Sans nom"
                  onBlur={(e) => { const v = e.target.value.trim(); if (v !== l.name) commit((bb) => { const x = bb.labels.find((y) => y.id === l.id); if (x) x.name = v; return bb; }); }} />
                <select className="fld" style={{ width: 92, background: l.color, color: "#fff" }} value={l.color} aria-label="Couleur"
                  onChange={(e) => { const v = e.target.value; commit((bb) => { const x = bb.labels.find((y) => y.id === l.id); if (x) x.color = v; return bb; }); }}>
                  {PALETTE.map((p, i) => <option key={p} value={p} style={{ background: p }}>Couleur {i + 1}</option>)}
                </select>
                <Confirm className="del" label="×" confirmLabel="Supprimer" onConfirm={() => commit((bb) => {
                  bb.labels = bb.labels.filter((x) => x.id !== l.id);
                  Object.values(bb.cards).forEach((c) => (c.labels = c.labels.filter((x) => x !== l.id)));
                  return bb;
                })} />
              </div>
            ))}
            <button className="btn ghost" onClick={() => commit((bb) => { bb.labels.push({ id: uid(), name: "", color: PALETTE[bb.labels.length % PALETTE.length] }); return bb; })}>+ Créer une étiquette</button>
          </div>
        </Sheet>
      )}

      {panel === "archive" && (
        <Sheet title="Archives" onClose={() => setPanel(null)}>
          <div className="sec">
            <h4>Cartes archivées</h4>
            {archivedCards.length === 0 && <div className="empty">Aucune carte archivée.</div>}
            {archivedCards.map((c) => (
              <div key={c.id} className="mrow"><span>{c.title}<small>{b.lists.find((l) => l.cardIds.includes(c.id))?.name}</small></span>
                <button className="btn ghost" onClick={() => commit((bb) => {
                  const x = bb.cards[c.id]; if (!x) return bb; x.archived = false;
                  const home = bb.lists.find((l) => l.cardIds.includes(c.id));
                  if (!home || home.archived) { bb.lists.forEach((l) => (l.cardIds = l.cardIds.filter((y) => y !== c.id))); const first = bb.lists.find((l) => !l.archived); if (first) first.cardIds.push(c.id); }
                  return bb;
                }, `a restauré « ${c.title} »`)}>Restaurer</button>
                <Confirm className="del" label="Supprimer" confirmLabel="Supprimer" onConfirm={() => commit((bb) => { bb.lists.forEach((l) => (l.cardIds = l.cardIds.filter((y) => y !== c.id))); delete bb.cards[c.id]; return bb; })} />
              </div>
            ))}
          </div>
          <div className="sec">
            <h4>Listes archivées</h4>
            {archivedLists.length === 0 && <div className="empty">Aucune liste archivée.</div>}
            {archivedLists.map((l) => (
              <div key={l.id} className="mrow"><span>{l.name}<small>{l.cardIds.length} carte{l.cardIds.length > 1 ? "s" : ""}</small></span>
                <button className="btn ghost" onClick={() => commit((bb) => { const x = bb.lists.find((y) => y.id === l.id); if (x) x.archived = false; return bb; }, `a restauré la liste « ${l.name} »`)}>Restaurer</button>
                <Confirm className="del" label="Supprimer" confirmLabel="Supprimer" onConfirm={() => commit((bb) => {
                  const x = bb.lists.find((y) => y.id === l.id); if (!x) return bb;
                  x.cardIds.forEach((cid) => delete bb.cards[cid]); bb.lists = bb.lists.filter((y) => y.id !== l.id); return bb;
                }, `a supprimé la liste « ${l.name} »`)} />
              </div>
            ))}
          </div>
        </Sheet>
      )}

      {panel === "activity" && (
        <Sheet title="Activité" onClose={() => setPanel(null)}>
          <div className="sec">
            {(b.activity || []).length === 0 && <div className="empty">Aucune activité pour l'instant.</div>}
            {(b.activity || []).map((a) => <div key={a.id} className="act"><b>{a.who}</b> {a.text}<time>{fmtAgo(a.at)}</time></div>)}
          </div>
        </Sheet>
      )}

      {panel === "settings" && <SettingsPanel b={b} isOwner={isOwner} commit={commit} back={back} close={() => setPanel(null)} />}
    </div>
  );
}

function SettingsPanel({ b, isOwner, commit, back, close }) {
  const [err, setErr] = useState("");
  return (
    <Sheet title="Paramètres du tableau" onClose={close}>
      <div className="sec">
        <h4>Couleur de fond</h4>
        <Swatches colors={BG} value={b.color} onPick={(color) => commit((bb) => { bb.color = color; return bb; })} />
      </div>
      <div className="sec">
        <h4>Créateur</h4>
        <p style={{ margin: 0 }}>{b.members.find((m) => m.email === b.owner)?.name} ({b.owner})</p>
      </div>
      {isOwner && (
        <div className="sec">
          <h4>Supprimer le tableau</h4>
          <Confirm label="Supprimer ce tableau" confirmLabel="Supprimer pour tous les membres" onConfirm={async () => {
            try { await api("deleteBoard", { id: b.id }); back(); } catch (e) { setErr(errText(e)); }
          }} />
          <p className="hint">Ses lignes sont retirées du classeur. Les sauvegardes Excel déjà faites le conservent.</p>
          {err && <p className="err">{err}</p>}
        </div>
      )}
    </Sheet>
  );
}

function Agenda({ b, visible, open }) {
  const inActive = (c) => !b.lists.find((l) => l.cardIds.includes(c.id))?.archived;
  const cards = Object.values(b.cards).filter((c) => c.due && visible(c) && inActive(c)).sort((x, y) => (x.due < y.due ? -1 : 1));
  const now = new Date(); const endToday = new Date(now); endToday.setHours(23, 59, 59, 999);
  const weekEnd = new Date(endToday.getTime() + 6 * 86400000);
  const groups = [
    ["En retard", cards.filter((c) => !c.dueDone && new Date(c.due) < now)],
    ["Aujourd'hui", cards.filter((c) => !c.dueDone && new Date(c.due) >= now && new Date(c.due) <= endToday)],
    ["Cette semaine", cards.filter((c) => !c.dueDone && new Date(c.due) > endToday && new Date(c.due) <= weekEnd)],
    ["Plus tard", cards.filter((c) => !c.dueDone && new Date(c.due) > weekEnd)],
    ["Terminées", cards.filter((c) => c.dueDone)],
  ].filter(([, a]) => a.length);
  const noDue = Object.values(b.cards).filter((c) => !c.due && visible(c) && inActive(c)).length;
  return (
    <main className="agenda">
      {groups.length === 0 && <h3>Aucune carte avec échéance. Ouvrez une carte pour en ajouter une.</h3>}
      {groups.map(([t, a]) => (
        <div key={t}><h3>{t} · {a.length}</h3>
          {a.map((c) => <div key={c.id}><CardTile c={c} b={b} onOpen={() => open(c.id)} dragProps={{}} /></div>)}
        </div>
      ))}
      {noDue > 0 && <h3 style={{ opacity: 0.8, fontWeight: 400 }}>{noDue} carte{noDue > 1 ? "s" : ""} sans échéance.</h3>}
    </main>
  );
}

function MembersPanel({ b, user, isOwner, reload, leave, close }) {
  const [email, setEmail] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const invite = async () => {
    const e = norm(email);
    if (!EMAIL_RE.test(e)) return setMsg("Adresse e-mail invalide.");
    setBusy(true);
    try {
      const r = await api("invite", { id: b.id, invite: e });
      await reload(); setEmail("");
      setMsg(r.hasAccount ? "Cette personne voit maintenant le tableau dans sa liste." : `Invitation enregistrée. ${e} verra ce tableau après avoir créé son compte avec cette adresse.`);
    } catch (x) { setMsg(errText(x)); }
    setBusy(false);
  };
  const remove = async (m) => {
    const self = m.email === user.email;
    try { await api("removeMember", { id: b.id, member: m.email }); if (self) leave(); else await reload(); }
    catch (x) { setMsg(errText(x)); }
  };
  return (
    <Sheet title="Membres" onClose={close}>
      <div className="sec">
        {b.members.map((m) => (
          <div key={m.email} className="mrow"><Avatar name={m.name} email={m.email} />
            <span>{m.name}{m.email === user.email && " (vous)"}<small>{m.email}{m.email === b.owner ? " · créateur" : ""}</small></span>
            {isOwner && m.email !== b.owner && <Confirm className="del" label="Retirer" confirmLabel="Retirer" onConfirm={() => remove(m)} />}
          </div>
        ))}
      </div>
      {isOwner ? (
        <div className="sec">
          <h4>Inviter par e-mail</h4>
          <div className="inl"><input className="fld" type="email" placeholder="adresse@exemple.com" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && invite()} />
            <button className="btn" onClick={invite} disabled={busy}>{busy ? "…" : "Inviter"}</button></div>
          <p className="hint">Aucun e-mail n'est envoyé : transmettez l'adresse de la page. La personne se connecte avec cette adresse et ne voit que les tableaux auxquels elle est invitée.</p>
        </div>
      ) : (
        <div className="sec">
          <p className="hint">Seul le créateur du tableau peut inviter ou retirer des membres.</p>
          <Confirm label="Quitter ce tableau" confirmLabel="Quitter" onConfirm={() => remove(b.members.find((m) => m.email === user.email))} />
        </div>
      )}
      {msg && <p className="hint" role="status">{msg}</p>}
    </Sheet>
  );
}

/* ============ Application ============ */
function App() {
  const [user, setUser] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [boardId, setBoardId] = useState(() => new URLSearchParams(location.hash.slice(1)).get("t"));
  const userRef = useRef(null);
  userRef.current = user;

  useEffect(() => {
    const onCred = async () => {
      if (userRef.current) return; // simple renouvellement du jeton
      setBusy(true); setMsg("");
      try { const r = await api("me"); setUser(r.user); }
      catch (e) { setMsg(errText(e)); }
      setBusy(false);
    };
    const onSession = () => { ID_TOKEN = null; setUser(null); setMsg("Votre connexion Google a expiré. Reconnectez-vous."); };
    window.addEventListener("tb-credential", onCred);
    window.addEventListener("tb-session", onSession);
    return () => { window.removeEventListener("tb-credential", onCred); window.removeEventListener("tb-session", onSession); };
  }, []);

  // L'adresse garde le tableau ouvert (#t=…) pour pouvoir actualiser la page
  useEffect(() => { history.replaceState(null, "", boardId ? "#t=" + boardId : location.pathname + location.search); }, [boardId]);

  const logout = () => {
    try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    ID_TOKEN = null; setUser(null); setBoardId(null); setMsg("");
  };
  const toggleStar = async (id) => {
    const stars = user.stars.includes(id) ? user.stars.filter((x) => x !== id) : [...user.stars, id];
    setUser({ ...user, stars });
    try { const r = await api("setStars", { stars }); setUser(r.user); } catch (e) {}
  };
  const setName = async (name) => { try { const r = await api("setName", { name }); setUser(r.user); } catch (e) {} };

  if (!API_URL || !GOOGLE_CLIENT_ID) return (
    <div className="auth"><div className="auth-box">
      <h1 className="disp" style={{ fontSize: 26 }}>Configuration incomplète</h1>
      <p className="sub">Renseignez API_URL et GOOGLE_CLIENT_ID en haut du script de index.html, puis republiez la page.</p>
    </div></div>
  );
  if (!user) return <Auth busy={busy} message={msg} />;
  if (boardId) return <Board key={boardId} id={boardId} user={user} toggleStar={toggleStar} back={() => setBoardId(null)} />;
  return <Home user={user} toggleStar={toggleStar} setName={setName} open={setBoardId} logout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
